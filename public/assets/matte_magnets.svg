<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F7F3ED"/>
      <stop offset="60%" stop-color="#E8DDD0"/>
      <stop offset="100%" stop-color="#D9CCBD"/>
    </radialGradient>
    <radialGradient id="dishGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F0E8DD"/>
      <stop offset="100%" stop-color="#DDCFBF"/>
    </radialGradient>
    <linearGradient id="goldMatte1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BA88"/>
      <stop offset="40%" stop-color="#B69A67"/>
      <stop offset="70%" stop-color="#9A7E4F"/>
      <stop offset="100%" stop-color="#80673D"/>
    </linearGradient>
    <linearGradient id="roseMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B8AB"/>
      <stop offset="50%" stop-color="#C59A8D"/>
      <stop offset="100%" stop-color="#9E766A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#352B27" flood-opacity="0.14"/>
    </filter>
    <filter id="magnetShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#352B27" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background Warm Canvas -->
  <rect width="800" height="1067" fill="url(#bgGrad)"/>

  <!-- Minimal Draped Fabric Fold Texture in Background -->
  <path d="M-50 200 C200 350 400 150 850 300 L850 1100 L-50 1100 Z" fill="#EFE5D8" opacity="0.4"/>
  <path d="M-50 450 C300 550 500 400 850 500 L850 1100 L-50 1100 Z" fill="#E5D8C7" opacity="0.3"/>

  <!-- Organic Travertine Ceramic Presentation Dish -->
  <ellipse cx="400" cy="560" rx="260" ry="190" fill="url(#dishGrad)" filter="url(#softShadow)"/>
  <ellipse cx="400" cy="555" rx="230" ry="165" fill="none" stroke="#E2D4C3" stroke-width="2" opacity="0.7"/>

  <!-- First Magnetic Disc (Matte Gold) -->
  <g transform="translate(350, 520)" filter="url(#magnetShadow)">
    <circle cx="0" cy="0" r="54" fill="url(#goldMatte1)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#EAD5AE" stroke-width="1.5" opacity="0.6"/>
    <!-- Subtle Engraved Brand Monogram "N" -->
    <text x="0" y="10" font-family="'Cormorant Garamond', serif" font-size="30" font-weight="300" fill="#F7F3ED" text-anchor="middle" letter-spacing="2">N</text>
  </g>

  <!-- Second Magnetic Disc (Rose Gold, Overlapping) -->
  <g transform="translate(440, 560)" filter="url(#magnetShadow)">
    <circle cx="0" cy="0" r="54" fill="url(#roseMatte)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FCE2D8" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="10" font-family="'Cormorant Garamond', serif" font-size="30" font-weight="300" fill="#F7F3ED" text-anchor="middle" letter-spacing="2">N</text>
  </g>

  <!-- Product Title & Badge -->
  <text x="400" y="830" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="500" fill="#352B27" text-anchor="middle" letter-spacing="3">NOORE MAISON</text>
  <text x="400" y="865" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#7B8068" text-anchor="middle" letter-spacing="4">N52 NEODYMIUM MATTE MAGNETS</text>
  <text x="400" y="895" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="#A58E7A" text-anchor="middle" letter-spacing="1.5">Snag-Free Fabric Protection • Guaranteed Zero Needle Holes</text>
</svg>
